# E1：Heston d=2，无成本（论文 §5.2）；5 个 seed。
exp: e1
kind: e1
seeds: [0, 1, 2, 3, 4]
device: auto
n_steps: 30
batch: 256
eps: 0.0
alpha: 0.5

policy:
  name: recurrent
  hidden: 17          # d + 15
  recurrent: true
  batch_norm: true

market:
  model: heston
  d: 2
  s0: 100.0
  k: 100.0
  t: 0.08219178082191781   # 30/365
  kappa: 1.0
  theta: 0.04
  sigma: 2.0
  rho: -0.7
  v0: 0.04

train:
  n_iter: 5000
  lr: 0.005
  eval_paths: 100000
  eval_seed_offset: 10000
  log_every: 250
